name: tibco

gcr:
  url: https://eu.gcr.io
  token: $GCP_AUTH_TOKEN

build:
  base:
    context: tibco/base/1.0
  psc-ems-client:
    context: 8.6.0/ems-client
    args:
      EMS_VERSION: "8.6"

deploy:
  commands:
    - name: Deploy
      command: helm upgrade --install ems-service -f 8.6.0/helm/ems-service/minikube-values.yaml 8.6.0/helm/ems-service